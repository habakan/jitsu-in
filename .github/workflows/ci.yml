name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake
          make deps

      - name: The pinned toolchain, so this is the build a release reproduces
        run: |
          V=34.0
          curl -sL -o /tmp/sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-$V-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  /tmp/sdk.tar.gz" | sha256sum -c -
          tar xzf /tmp/sdk.tar.gz -C /tmp
          curl -sL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          W=1.261.0
          curl -sL -o /tmp/wt.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v$W/wasm-tools-$W-x86_64-linux.tar.gz
          tar xzf /tmp/wt.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-$W-x86_64-linux/wasm-tools /usr/local/bin/
          K=2.4.20
          curl -sL -o /tmp/kc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v$K/kotlin-compiler-$K.zip
          echo "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7  /tmp/kc.zip" | sha256sum -c -
          unzip -q /tmp/kc.zip -d /tmp
          echo "/tmp/kotlinc/bin" >> $GITHUB_PATH

      - name: C formatting and static analysis
        run: |
          SDK=/tmp/wasi-sdk-34.0-x86_64-linux
          make check-c-format check-c-tidy LLVM=$SDK/bin WASI=$SDK/share/wasi-sysroot

      - name: Build both modules
        run: |
          SDK=/tmp/wasi-sdk-34.0-x86_64-linux
          echo "TOOLS=LLVM=$SDK/bin WASI=$SDK/share/wasi-sysroot RTLIB=$SDK/lib/clang/23/lib/wasm32-unknown-wasi WASM_OPT=/tmp/binaryen-version_132/bin/wasm-opt" >> $GITHUB_ENV
          make all \
            LLVM=$SDK/bin WASI=$SDK/share/wasi-sysroot \
            RTLIB=$SDK/lib/clang/23/lib/wasm32-unknown-wasi \
            WASM_OPT=/tmp/binaryen-version_132/bin/wasm-opt

      # The release is built from these same pins, so this says the hashes are still the ones we publish
      - name: Still the bytes we released
        run: |
          sha256sum build/parser.wasm build/signer.wasm
          grep "$(sha256sum build/parser.wasm | cut -d' ' -f1)" checksums.txt \
            || { echo "parser.wasm changed; update checksums.txt deliberately"; exit 1; }
          grep "$(sha256sum build/signer.wasm | cut -d' ' -f1)" checksums.txt \
            || { echo "signer.wasm changed; update checksums.txt deliberately"; exit 1; }

      - name: Is what we ship the right shape (no imports, fixed memory, no mutable global exported)
        run: make check-wasm

      - name: The host libraries type-check, and the committed .d.mts are current
        run: make check-types
      - name: The specs, all three host libraries and the structs agree on every offset
        run: make check-layout

      - name: The parser (vectors, fuzzing, its own hosts)
        run: |
          SDK=/tmp/wasi-sdk-34.0-x86_64-linux
          make check-parser \
            LLVM=$SDK/bin WASI=$SDK/share/wasi-sysroot \
            RTLIB=$SDK/lib/clang/23/lib/wasm32-unknown-wasi \
            WASM_OPT=/tmp/binaryen-version_132/bin/wasm-opt

      - name: The same parser vectors under WAMR's classic interpreter
        run: |
          make wamr-deps
          make check-wamr

      - name: signer.wasm from JavaScript (24 checks)
        run: make check-signer-js

      - name: signer.wasm from Kotlin (25 checks)
        run: make check-signer-kotlin

      # The Swift host is not run here: WasmKit 0.4.1 needs Swift 6.3 or newer and the runners do not
      # have it yet, so it is verified on macOS. check-layout does check its constants either way
      - name: The hosts that can run here agree byte for byte
        run: make check-hosts-agree REQUIRE_KOTLIN=1

      # Bitcoin Core as the oracle: it decides what a PSBT means, and our signatures have to equal
      # its signatures byte for byte. Pinned and hash-checked like every other tool here
      - name: Bitcoin Core (pinned by version and by hash)
        run: |
          V=28.1
          curl -sL -o /tmp/btc.tar.gz \
            https://bitcoincore.org/bin/bitcoin-core-$V/bitcoin-$V-x86_64-linux-gnu.tar.gz
          echo "07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7  /tmp/btc.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/btc.tar.gz -C /tmp
          sudo install /tmp/bitcoin-$V/bin/bitcoind /tmp/bitcoin-$V/bin/bitcoin-cli /usr/local/bin/
          bitcoind --version | head -1
      - name: The parse and the signatures equal Bitcoin Core's
        run: make check-core-diff

      - name: Preserve the tested modules for a tagged release
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: |
            build/parser.wasm
            build/signer.wasm
          if-no-files-found: error
          retention-days: 7
