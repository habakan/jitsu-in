<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Comparing WebAssembly runtimes</title>
  <desc id="desc">The same PSBT test vectors run in WAMR, V8, Chicory and WasmKit. Their output bytes are compared; identical outputs agree for that vector, while differences need investigation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#8a93a3"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#2f9e5e"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#cc4b4b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #1a1d24; font-size: 22px; font-weight: 650; }
      .label { fill: #1a1d24; font-size: 16px; font-weight: 600; }
      .sub { fill: #687080; font-size: 12px; }
      .small { fill: #687080; font-size: 11px; }
      .edge { fill: none; stroke: #8a93a3; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1120" height="470" rx="16" fill="#fff"/>
  <text class="title" x="560" y="36" text-anchor="middle">Same test vectors. Independent runtimes. Compare the bytes.</text>

  <rect x="22" y="190" width="190" height="100" rx="12" fill="#f5f7fa" stroke="#aeb7c5" stroke-width="1.5"/>
  <g transform="translate(45 215)" fill="none" stroke="#596579" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 1h24l12 12v36H3z"/><path d="M27 1v13h12M10 25h21M10 33h21M10 41h14"/>
  </g>
  <text class="label" x="104" y="229">Same input</text>
  <text class="sub" x="104" y="250">PSBT test vectors</text>
  <text class="small" x="104" y="269">one byte sequence</text>

  <path class="edge" d="M212 240h30M242 91v282"/>
  <path class="edge" d="M242 91h34" marker-end="url(#arrow)"/>
  <path class="edge" d="M242 185h34" marker-end="url(#arrow)"/>
  <path class="edge" d="M242 279h34" marker-end="url(#arrow)"/>
  <path class="edge" d="M242 373h34" marker-end="url(#arrow)"/>

  <g>
    <rect x="280" y="56" width="270" height="70" rx="11" fill="#f2fbf5" stroke="#2f9e5e" stroke-width="1.5"/>
    <g transform="translate(298 78)" fill="none" stroke="#2f9e5e" stroke-width="2" stroke-linecap="round">
      <rect x="7" y="5" width="22" height="22" rx="3"/><path d="M12 0v5m12-5v5M12 27v6m12-6v6M2 10h5m-5 12h5m22-12h5m-5 12h5"/>
    </g>
    <text class="label" x="348" y="84">WAMR</text>
    <text class="sub" x="348" y="103">RP2350 device · QEMU</text>
    <rect x="468" y="75" width="66" height="26" rx="13" fill="#e5f5eb"/>
    <text x="501" y="92" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="600">parser</text>
  </g>

  <g>
    <rect x="280" y="150" width="270" height="70" rx="11" fill="#f5f8ff" stroke="#7892d0" stroke-width="1.5"/>
    <path d="M307 168 324 178v19l-17 10-17-10v-19z" fill="#eef2ff" stroke="#526fb7" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="307" y="191" text-anchor="middle" fill="#405b9b" font-size="11" font-weight="700">V8</text>
    <text class="label" x="348" y="178">V8</text>
    <text class="sub" x="348" y="197">Node.js</text>
    <rect x="438" y="169" width="96" height="26" rx="13" fill="#e8edfa"/>
    <text x="486" y="186" text-anchor="middle" fill="#405b9b" font-size="10.5" font-weight="600">parser + signer</text>
  </g>

  <g>
    <rect x="280" y="244" width="270" height="70" rx="11" fill="#fff8ef" stroke="#d69852" stroke-width="1.5"/>
    <g transform="translate(299 260)" fill="none" stroke="#b77931" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 17h27l-3 18H8zM32 20h5a6 6 0 0 1 0 12h-7M11 10c-4-4 4-5 0-9m10 9c-4-4 4-5 0-9"/>
    </g>
    <text class="label" x="348" y="272">Chicory</text>
    <text class="sub" x="348" y="291">JVM · Android</text>
    <rect x="438" y="263" width="96" height="26" rx="13" fill="#f9ead7"/>
    <text x="486" y="280" text-anchor="middle" fill="#89561e" font-size="10.5" font-weight="600">parser + signer</text>
  </g>

  <g>
    <rect x="280" y="338" width="270" height="70" rx="11" fill="#f7f4ff" stroke="#8e79c7" stroke-width="1.5"/>
    <g transform="translate(300 354)" fill="none" stroke="#745bb4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="1" width="29" height="39" rx="5"/><path d="M12 6h11M14 34h7"/>
    </g>
    <text class="label" x="348" y="366">WasmKit</text>
    <text class="sub" x="348" y="385">Swift · iOS</text>
    <rect x="438" y="357" width="96" height="26" rx="13" fill="#ede8fa"/>
    <text x="486" y="374" text-anchor="middle" fill="#624a9c" font-size="10.5" font-weight="600">parser + signer</text>
  </g>

  <path class="edge" d="M550 91h52M550 185h52M550 279h52M550 373h52M602 91v282M602 232h42" marker-end="url(#arrow)"/>

  <rect x="650" y="166" width="210" height="132" rx="14" fill="#faf8ff" stroke="#654ff0" stroke-width="1.8"/>
  <g transform="translate(738 185)" fill="none" stroke="#654ff0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h36v30H2zM9 11l6 6-6 6m12 0h9"/>
  </g>
  <text class="label" x="755" y="244" text-anchor="middle">Compare output bytes</text>
  <text class="sub" x="755" y="265" text-anchor="middle">compare matching module outputs</text>
  <text class="small" x="755" y="283" text-anchor="middle">plans · reviews · signatures</text>

  <path d="M860 232h25v-49h27" fill="none" stroke="#2f9e5e" stroke-width="1.8" marker-end="url(#green-arrow)"/>
  <path d="M885 232v89h27" fill="none" stroke="#cc4b4b" stroke-width="1.8" marker-end="url(#red-arrow)"/>

  <rect x="920" y="144" width="178" height="78" rx="12" fill="#f2fbf5" stroke="#2f9e5e" stroke-width="1.5"/>
  <circle cx="945" cy="183" r="13" fill="#2f9e5e"/>
  <path d="m939 183 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="967" y="178" fill="#166534" font-size="14" font-weight="650">Identical</text>
  <text class="small" x="967" y="197">outputs agree here</text>

  <rect x="920" y="282" width="178" height="78" rx="12" fill="#fff5f4" stroke="#cc4b4b" stroke-width="1.5"/>
  <circle cx="945" cy="321" r="13" fill="#cc4b4b"/>
  <path d="m941 317 8 8m0-8-8 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="967" y="316" fill="#9d3030" font-size="14" font-weight="650">Different</text>
  <text class="small" x="967" y="335">inspect host and runtime</text>

  <text class="small" x="560" y="444" text-anchor="middle">Agreement checks consistency for these vectors; it does not prove the transaction logic is correct.</text>
</svg>
